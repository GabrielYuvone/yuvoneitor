[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# El build genera un unico dist/index.html autocontenido (vite-plugin-singlefile),
# no hace falta reglas de rewrite para SPA.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
